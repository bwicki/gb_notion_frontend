<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Basket Reporting</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Basket">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<style>
:root{
  --bg:#FFFFFF; --ink:#16181A; --muted:#71767B; --line:#E6E8EA;
  --btn-bg:#16181A; --btn-ink:#FFFFFF;
  --pad:22px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="night"]{
  --bg:#000000; --ink:#FF4E2A; --muted:#9A331B; --line:#33110A;
  --btn-bg:#FF4E2A; --btn-ink:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 17px/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  padding:var(--safe-t) 0 var(--safe-b);
  display:flex;flex-direction:column;min-height:100%;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:0 var(--pad)}

header{flex:0 0 auto;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;height:50px}
header .id{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
header .st{flex:1;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden}
header button{width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto}
header button:last-child{margin-right:-9px}
header svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 0 44px}
.view{display:none}.view.on{display:block}

#logo{display:none;max-height:44px;max-width:70%;margin-bottom:24px}
#logo.on{display:block}
.readout{margin-bottom:34px}
.readout b{display:block;font-size:58px;font-weight:300;letter-spacing:-.035em;line-height:1}
.readout span{display:block;font-size:14px;color:var(--muted);margin-top:9px}

.lab{font-size:13px;color:var(--muted);margin:0 0 10px}

.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px}
.types button{height:62px;border:1px solid var(--line);border-radius:10px;font-size:17px}
.types button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.blk{display:none;margin-bottom:30px}.blk.on{display:block}
.f{margin-bottom:22px}
input[type=text],input[type=number],textarea{
  width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  border-radius:0;color:var(--ink);font:inherit;padding:12px 0;appearance:none;
}
textarea{min-height:80px;resize:none;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus{outline:0;border-bottom-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;font-size:15px}
.pills button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;color:var(--muted)}
.links button{text-decoration:underline;text-underline-offset:3px}

.go{width:100%;height:58px;border-radius:10px;background:var(--btn-bg);color:var(--btn-ink);font-size:17px}
.go:active{opacity:.8}
.go.sec{background:none;color:var(--ink);border:1px solid var(--line)}
.go.warn{background:none;color:var(--ink);border:1px solid var(--ink)}
.go+.go{margin-top:10px}

.nav{display:flex;gap:22px;margin-top:36px;padding-top:22px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.nav button.on{color:var(--ink)}

.entry{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
.entry .t{font-size:13px;color:var(--muted);width:46px;flex:0 0 auto}
.entry .c{flex:1;min-width:0}
.entry .c i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word}
.entry .p{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted);flex:0 0 auto}
.entry .p.done{background:var(--muted)}
.none{color:var(--muted);font-size:15px;padding:22px 0}
h3{font-size:13px;color:var(--muted);font-weight:400;margin:34px 0 12px}

#puck{display:none;position:fixed;z-index:60;padding:14px 20px;border-radius:26px;
  background:var(--bg);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.14);
  font-size:20px;touch-action:none;white-space:nowrap}
html[data-theme="night"] #puck{box-shadow:0 6px 24px rgba(255,78,42,.14)}
#puck span{font-size:13px;color:var(--muted);margin-left:5px}
body.min>header,body.min>main{display:none}
body.min{background:transparent}
body.min #puck{display:block}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 18px;font-size:15px;
  opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="id" id="hId">—</span>
    <span class="st" id="hSt"></span>
    <button id="btnTheme" aria-label="Day or night"><svg id="icTheme" viewBox="0 0 24 24"></svg></button>
    <button id="btnMin" aria-label="Minimise"><svg viewBox="0 0 24 24"><path d="M20 4l-6 6M14 10V5M14 10h5M4 20l6-6M10 14v5M10 14H5"/></svg></button>
  </div>
</header>

<main>
  <!-- REPORT -->
  <div class="view on wrap" id="v-form">
    <img id="logo" alt="">
    <div class="readout">
      <b class="num" id="rNum">—</b>
      <span id="rSub">on board</span>
    </div>

    <p class="lab">Message type</p>
    <div class="types" id="types">
      <button data-t="Ballast" class="on">Ballast</button>
      <button data-t="ATC">ATC</button>
      <button data-t="Ressources">Ressources</button>
      <button data-t="Other">Other</button>
    </div>

    <div class="blk on" id="b-Ballast">
      <div class="f">
        <div class="pills" id="bAct">
          <button data-v="drop" class="on">Drop</button>
          <button data-v="take">Take on</button>
          <button data-v="count">Count on board</button>
        </div>
      </div>
      <div class="f" id="bQuickWrap"><div class="pills" id="bQuick"></div></div>
      <div class="f"><input type="number" id="bKg" inputmode="decimal" step="0.5" placeholder="Kilograms"></div>
      <div class="f"><input type="text" id="bNote" placeholder="Remark (optional)"></div>
    </div>

    <div class="blk" id="b-ATC">
      <div class="f">
        <div class="pills" id="aDir">
          <button data-v="RX" class="on">Received</button>
          <button data-v="TX">Sent</button>
        </div>
      </div>
      <div class="f two">
        <input type="text" id="aStation" placeholder="Station" autocapitalize="characters">
        <input type="text" id="aFreq" inputmode="decimal" placeholder="Frequency">
      </div>
      <div class="f"><input type="text" id="aSquawk" inputmode="numeric" maxlength="4" placeholder="Squawk"></div>
      <div class="f"><textarea id="aMsg" placeholder="Message"></textarea>
        <div class="links" id="aChips" style="margin-top:12px"></div>
      </div>
    </div>

    <div class="blk" id="b-Ressources">
      <div class="f">
        <p class="lab">Pilot in command</p>
        <div class="pills" id="cPic"></div>
      </div>
      <div class="f">
        <p class="lab">Resting</p>
        <div class="pills" id="cRest"></div>
      </div>
      <div class="f"><input type="text" id="cNote" placeholder="Remark (optional)"></div>
    </div>

    <div class="blk" id="b-Other">
      <div class="f"><textarea id="oMsg" placeholder="Note"></textarea></div>
    </div>

    <button class="go" id="btnPost">Post to CC Notion</button>

    <div class="nav">
      <button data-v="form" class="on">Report</button>
      <button data-v="log">Log</button>
      <button data-v="set">Setup</button>
    </div>
  </div>

  <!-- LOG -->
  <div class="view wrap" id="v-log">
    <p class="lab">Log</p>
    <div id="logList"></div>
    <h3>Transfer</h3>
    <button class="go" id="btnSync">Send to GitHub now</button>
    <button class="go sec" id="btnCsv">Save CSV</button>
    <button class="go sec" id="btnJson">Save JSON</button>
    <p class="lab" id="syncNote" style="margin-top:14px"></p>
    <div class="nav">
      <button data-v="form">Report</button>
      <button data-v="log" class="on">Log</button>
      <button data-v="set">Setup</button>
    </div>
  </div>

  <!-- SETUP -->
  <div class="view wrap" id="v-set">
    <p class="lab">Flight</p>
    <div class="f"><input type="text" id="sFlight" placeholder="Flight ID"></div>
    <div class="f"><input type="text" id="sCall" placeholder="Callsign" autocapitalize="characters"></div>
    <div class="f two"><input type="text" id="sP1" placeholder="Pilot 1"><input type="text" id="sP2" placeholder="Pilot 2"></div>
    <div class="f two"><input type="number" id="sInit" inputmode="decimal" placeholder="Start ballast kg"><input type="text" id="sSteps" placeholder="Bag sizes"></div>

    <h3>GitHub</h3>
    <div class="f"><input type="text" id="sRepo" placeholder="owner/repo" autocapitalize="none" autocorrect="off"></div>
    <div class="f two"><input type="text" id="sBranch" placeholder="Branch" autocapitalize="none"><input type="text" id="sDir" placeholder="Folder" autocapitalize="none"></div>
    <div class="f"><input type="text" id="sToken" placeholder="Fine-grained token" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="f">
      <p class="lab">Sending</p>
      <div class="pills" id="sAuto"><button data-v="1">Automatic</button><button data-v="0">Manual only</button></div>
    </div>

    <h3>App</h3>
    <div class="f"><input type="text" id="sLogo" placeholder="Logo URL (optional)" autocapitalize="none" autocorrect="off"></div>
    <div class="f">
      <p class="lab">Confirmation tone</p>
      <div class="pills" id="sBeep"><button data-v="1">On</button><button data-v="0">Off</button></div>
    </div>

    <button class="go" id="btnSave">Save settings</button>
    <button class="go sec" id="btnTest">Check connection</button>
    <button class="go warn" id="btnWipe">Clear entries on this device</button>

    <div class="nav">
      <button data-v="form">Report</button>
      <button data-v="log">Log</button>
      <button data-v="set" class="on">Setup</button>
    </div>
  </div>
</main>

<div id="puck" role="button" tabindex="0" aria-label="Open Basket Reporting"><b class="num" id="pNum">—</b><span>kg</span></div>
<div id="toast"></div>

<script>
"use strict";
/* ── State ─────────────────────────────────────────────────────────── */
const K_CFG='bsk.cfg.v2', K_ENT='bsk.entries.v2', K_UI='bsk.ui.v2';
const DEF={flight:'',call:'',p1:'Pilot 1',p2:'Pilot 2',init:0,steps:'5,10,15,25',
           repo:'',branch:'main',dir:'data',token:'',auto:1,beep:1,logo:'',theme:''};
let CFG=Object.assign({},DEF,load(K_CFG,{}));
let ENT=load(K_ENT,[]);
let UI=Object.assign({type:'Ballast',act:'drop',adir:'RX',pic:'p1',rest:'',view:'form'},load(K_UI,{}));
let GPS=null,GPSERR=null,SYNCING=false,LASTSYNC=null;
const DEV=(()=>{let d=localStorage.getItem('bsk.dev');if(!d){d='D'+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem('bsk.dev',d)}return d})();

function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full')}}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const r1=n=>Math.round(n*10)/10;
const pad=(n,w)=>String(n).padStart(w,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── Ballast maths ─────────────────────────────────────────────────── */
const chrono=()=>ENT.slice().sort((a,b)=>a.ts_utc<b.ts_utc?-1:a.ts_utc>b.ts_utc?1:a.seq-b.seq);
function onBoard(){
  let a=Number(CFG.init)||0;
  for(const e of chrono()){
    if(e.ballast_action==='count') a=Number(e.ballast_abs_kg)||0;
    else if(e.ballast_delta_kg) a=r1(a+Number(e.ballast_delta_kg));
  }
  return a;
}
function droppedTotal(){let s=0;for(const e of ENT)if(e.ballast_delta_kg<0)s+=-e.ballast_delta_kg;return r1(s)}

/* ── Entries ───────────────────────────────────────────────────────── */
const picName=()=>UI.pic==='p2'?(CFG.p2||'Pilot 2'):(CFG.p1||'Pilot 1');
const restName=()=>UI.rest==='p1'?(CFG.p1||'Pilot 1'):UI.rest==='p2'?(CFG.p2||'Pilot 2'):'';
function localISO(d){const o=-d.getTimezoneOffset(),s=o>=0?'+':'-',a=Math.abs(o);
  return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)+'T'+pad(d.getHours(),2)+':'+
         pad(d.getMinutes(),2)+':'+pad(d.getSeconds(),2)+s+pad(Math.floor(a/60),2)+':'+pad(a%60,2)}
const hm=i=>i?i.slice(11,16):'—';
function gpsSnap(){
  if(!GPS)return{lat:null,lon:null,alt_gps_m:null,gps_acc_m:null,gps_age_s:null,gps_fix:false};
  return{lat:+GPS.lat.toFixed(6),lon:+GPS.lon.toFixed(6),
    alt_gps_m:GPS.alt==null?null:Math.round(GPS.alt),
    gps_acc_m:GPS.acc==null?null:Math.round(GPS.acc),
    gps_age_s:Math.round((Date.now()-GPS.t)/1000),gps_fix:true};
}
function add(part){
  const now=new Date();
  const e=Object.assign({
    id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),
    flight_id:CFG.flight||'UNTITLED',callsign:CFG.call||'',
    seq:ENT.length?Math.max(...ENT.map(x=>x.seq||0))+1:1,device:DEV,
    ts_utc:now.toISOString(),ts_local:localISO(now),
    type:'Other',ballast_action:'',ballast_delta_kg:null,ballast_abs_kg:null,
    atc_dir:'',atc_station:'',atc_freq:'',atc_squawk:'',atc_msg:'',
    crew_pic:picName(),crew_rest:restName(),note:'',synced:false
  },gpsSnap(),part);
  if(e.ballast_action!=='count') e.ballast_abs_kg=r1(onBoard()+(Number(e.ballast_delta_kg)||0));
  ENT.push(e);save(K_ENT,ENT);paint();beep();
  if(Number(CFG.auto)&&CFG.repo&&CFG.token)sync(true);
}

/* ── GPS, wake lock, tone ──────────────────────────────────────────── */
if(navigator.geolocation)navigator.geolocation.watchPosition(
  p=>{GPS={lat:p.coords.latitude,lon:p.coords.longitude,alt:p.coords.altitude,acc:p.coords.accuracy,t:Date.now()};GPSERR=null;paintStatus()},
  e=>{GPSERR=e.code===1?'location off':'no fix';paintStatus()},
  {enableHighAccuracy:true,maximumAge:4000,timeout:20000});
let WL=null;
async function wake(){try{if('wakeLock'in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>WL=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&wake());
let AC=null;
function beep(){if(!Number(CFG.beep))return;try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);o.stop(AC.currentTime+.13)}catch(e){}}

/* ── GitHub ────────────────────────────────────────────────────────── */
const API='https://api.github.com';
const hdr=()=>({Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const b64e=s=>{const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob((s||'').replace(/\s/g,'')),c=>c.charCodeAt(0)));
const paths=()=>{const d=(CFG.dir||'data').replace(/^\/|\/$/g,''),b=(CFG.flight||'flight').replace(/[^A-Za-z0-9_-]/g,'-');
  return{json:`${d}/${b}.json`,csv:`${d}/${b}.csv`}};
async function ghGet(p){
  const r=await fetch(`${API}/repos/${CFG.repo}/contents/${encodeURI(p)}?ref=${encodeURIComponent(CFG.branch||'main')}`,{headers:hdr(),cache:'no-store'});
  if(r.status===404)return{sha:null,text:''};
  if(!r.ok)throw new Error('GET '+r.status);
  const j=await r.json();return{sha:j.sha,text:j.content?b64d(j.content):''};
}
async function ghPut(p,text,sha,msg){
  const r=await fetch(`${API}/repos/${CFG.repo}/contents/${encodeURI(p)}`,{method:'PUT',headers:hdr(),
    body:JSON.stringify({message:msg,content:b64e(text),sha:sha||undefined,branch:CFG.branch||'main'})});
  if(!r.ok)throw new Error('PUT '+r.status+' '+(await r.text()).slice(0,100));
}
const COLS=['flight_id','callsign','seq','device','ts_utc','ts_local','type','lat','lon','alt_gps_m','gps_acc_m','gps_age_s','gps_fix',
  'ballast_action','ballast_delta_kg','ballast_abs_kg','atc_dir','atc_station','atc_freq','atc_squawk','atc_msg','crew_pic','crew_rest','note','id'];
const cell=v=>{if(v==null)return'';const s=String(v);return /[",;\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCsv=r=>[COLS.join(',')].concat(r.map(e=>COLS.map(c=>cell(e[c])).join(','))).join('\n')+'\n';

async function sync(silent){
  if(SYNCING)return;
  if(!CFG.repo||!CFG.token){if(!silent)toast('Add repository and token in Setup');return}
  if(!navigator.onLine){if(!silent)toast('Offline — entries stay on this device');return}
  SYNCING=true;paintStatus();
  try{
    const p=paths();let remote=[];
    const g=await ghGet(p.json);
    if(g.text){try{remote=JSON.parse(g.text)}catch(e){remote=[]}}
    if(!Array.isArray(remote))remote=[];
    const m=new Map();
    remote.forEach(e=>{if(e&&e.id)m.set(e.id,e)});
    ENT.forEach(e=>{const c=Object.assign({},e);delete c.synced;m.set(c.id,c)});
    const all=[...m.values()].sort((a,b)=>a.ts_utc<b.ts_utc?-1:1);
    const msg=`${CFG.flight||'flight'} · ${all.length} rows · ${DEV}`;
    await ghPut(p.json,JSON.stringify(all,null,1),g.sha,msg);
    let cs=null;try{cs=(await ghGet(p.csv)).sha}catch(e){}
    await ghPut(p.csv,toCsv(all),cs,msg);
    ENT.forEach(e=>e.synced=true);save(K_ENT,ENT);LASTSYNC=new Date();paint();
    if(!silent)toast('Sent '+all.length+' rows');
  }catch(e){if(!silent)toast(String(e.message||e))}
  finally{SYNCING=false;paintStatus()}
}

/* ── Painting ──────────────────────────────────────────────────────── */
function paintStatus(){
  $('#hId').textContent=(CFG.flight||'No flight ID')+(CFG.call?' · '+CFG.call:'');
  const bits=[];
  if(GPS&&Date.now()-GPS.t<30000)bits.push('GPS ±'+Math.round(GPS.acc||0)+' m');
  else bits.push(GPS?'GPS stale':(GPSERR||'GPS searching'));
  const un=ENT.filter(e=>!e.synced).length;
  bits.push(SYNCING?'sending':un?un+' pending':(CFG.repo&&CFG.token?'sent':'local'));
  $('#hSt').textContent=bits.join(' · ');
  $('#syncNote').textContent=un?un+' entry(ies) not sent yet.'
    :(LASTSYNC?'All sent, last at '+localISO(LASTSYNC).slice(11,19)+'.':'Nothing sent yet.');
}
function paintReadout(){
  const v=onBoard();
  $('#rNum').textContent=(Number.isInteger(v)?v:v.toFixed(1))+' kg';
  $('#pNum').textContent=Number.isInteger(v)?v:v.toFixed(1);
  $('#rSub').textContent='on board · '+droppedTotal()+' kg dropped · PIC '+picName();
}
function paintLog(){
  const l=chrono().reverse(),box=$('#logList');
  if(!l.length){box.innerHTML='<p class="none">No entries yet.</p>';return}
  box.innerHTML=l.map(e=>{
    let h='',s='';
    if(e.type==='Ballast'){
      h=e.ballast_action==='count'?'Counted '+e.ballast_abs_kg+' kg':
        (e.ballast_delta_kg>0?'+':'')+e.ballast_delta_kg+' kg \u2192 '+e.ballast_abs_kg+' kg';
      s=e.note||'';
    }else if(e.type==='ATC'){
      h=(e.atc_dir==='TX'?'To ':'From ')+(e.atc_station||'ATC')+(e.atc_freq?' '+e.atc_freq:'')+(e.atc_squawk?' \u00b7 '+e.atc_squawk:'');
      s=e.atc_msg||'';
    }else if(e.type==='Ressources'){
      h='PIC '+(e.crew_pic||'\u2014');s=(e.crew_rest?e.crew_rest+' resting':'both awake')+(e.note?' \u00b7 '+e.note:'');
    }else{h='Note';s=e.note||''}
    const pos=e.gps_fix?e.lat.toFixed(4)+', '+e.lon.toFixed(4)+(e.alt_gps_m!=null?' \u00b7 '+e.alt_gps_m+' m':''):'no position';
    return `<div class="entry"><span class="t num">${hm(e.ts_local)}</span>
      <span class="c">${esc(h)}<i>${esc(s?s+' \u2014 ':'')}${esc(pos)}</i></span>
      <span class="p ${e.synced?'done':''}"></span></div>`;
  }).join('');
}
function paintQuick(){
  $('#bQuick').innerHTML=(CFG.steps||DEF.steps).split(',').map(s=>parseFloat(s)).filter(n=>n>0).slice(0,8)
    .map(n=>`<button data-v="${n}">${n} kg</button>`).join('');
}
function paintCrew(){
  const a=CFG.p1||'Pilot 1',b=CFG.p2||'Pilot 2';
  $('#cPic').innerHTML=`<button data-v="p1"${UI.pic==='p1'?' class="on"':''}>${esc(a)}</button><button data-v="p2"${UI.pic==='p2'?' class="on"':''}>${esc(b)}</button>`;
  $('#cRest').innerHTML=`<button data-v=""${!UI.rest?' class="on"':''}>Nobody</button><button data-v="p1"${UI.rest==='p1'?' class="on"':''}>${esc(a)}</button><button data-v="p2"${UI.rest==='p2'?' class="on"':''}>${esc(b)}</button>`;
}
function paint(){paintReadout();paintLog();paintStatus()}

/* ── Theme ─────────────────────────────────────────────────────────── */
const SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M5.2 12H3M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"/>';
const MOON='<path d="M20 14.4A8.6 8.6 0 0 1 9.6 4a8.6 8.6 0 1 0 10.4 10.4Z"/>';
function setTheme(t,persist){
  document.documentElement.dataset.theme=t;
  $('#icTheme').innerHTML=t==='night'?SUN:MOON;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='night'?'#000000':'#FFFFFF';
  if(persist){CFG.theme=t;save(K_CFG,CFG)}
}
$('#btnTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night',true);

/* ── Interaction ───────────────────────────────────────────────────── */
function pills(sel,cb){$(sel).addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  [...ev.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v,b)})}

function setView(v){
  UI.view=v;save(K_UI,UI);
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelector('main').scrollTop=0;
}
$$('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

function setType(t){
  UI.type=t;save(K_UI,UI);
  $$('#types button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $$('.blk').forEach(b=>b.classList.toggle('on',b.id==='b-'+t));
}
$('#types').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setType(b.dataset.t)});

pills('#bAct',v=>{UI.act=v;save(K_UI,UI);
  $('#bQuickWrap').style.display=v==='count'?'none':'';
  $('#bKg').placeholder=v==='count'?'Kilograms counted':'Kilograms'});
$('#bQuick').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  $$('#bQuick button').forEach(x=>x.classList.toggle('on',x===b));
  $('#bKg').value=b.dataset.v;
});
pills('#aDir',v=>{UI.adir=v;save(K_UI,UI)});
const MSGS=['Initial call','Position report','Level clearance','Squawk assigned','Frequency change','Leaving frequency'];
$('#aChips').innerHTML=MSGS.map(m=>`<button data-v="${m}">${m}</button>`).join('');
$('#aChips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const t=$('#aMsg');t.value=(t.value?t.value+' \u00b7 ':'')+b.dataset.v});
pills('#cPic',v=>{UI.pic=v;save(K_UI,UI);paintReadout()});
pills('#cRest',v=>{UI.rest=v;save(K_UI,UI)});

$('#btnPost').onclick=()=>{
  const t=UI.type;
  if(t==='Ballast'){
    const kg=parseFloat($('#bKg').value);
    if(!(kg>=0))return toast('Enter an amount in kilograms');
    add(UI.act==='count'
      ?{type:'Ballast',ballast_action:'count',ballast_abs_kg:r1(kg),note:$('#bNote').value.trim()}
      :{type:'Ballast',ballast_action:UI.act,ballast_delta_kg:r1(UI.act==='drop'?-kg:kg),note:$('#bNote').value.trim()});
    $('#bKg').value='';$('#bNote').value='';$$('#bQuick button').forEach(x=>x.classList.remove('on'));
    toast(UI.act==='count'?'On board set to '+kg+' kg':(UI.act==='drop'?'\u2212':'+')+kg+' kg');
  }else if(t==='ATC'){
    const st=$('#aStation').value.trim(),msg=$('#aMsg').value.trim();
    if(!st&&!msg)return toast('Enter a station or a message');
    add({type:'ATC',atc_dir:UI.adir,atc_station:st.toUpperCase(),atc_freq:$('#aFreq').value.trim(),
         atc_squawk:$('#aSquawk').value.trim(),atc_msg:msg});
    $('#aMsg').value='';$('#aSquawk').value='';toast('ATC posted');
  }else if(t==='Ressources'){
    add({type:'Ressources',note:$('#cNote').value.trim()});
    $('#cNote').value='';toast('Crew status posted');
  }else{
    const v=$('#oMsg').value.trim();
    if(!v)return toast('The note is empty');
    add({type:'Other',note:v});$('#oMsg').value='';toast('Note posted');
  }
};

$('#btnSync').onclick=()=>sync(false);
const dl=(txt,name,mime)=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:mime+';charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$('#btnCsv').onclick=()=>dl(toCsv(chrono()),(CFG.flight||'flightlog')+'.csv','text/csv');
$('#btnJson').onclick=()=>dl(JSON.stringify(chrono(),null,1),(CFG.flight||'flightlog')+'.json','application/json');

/* Setup */
const SF={flight:'#sFlight',call:'#sCall',p1:'#sP1',p2:'#sP2',init:'#sInit',steps:'#sSteps',
          repo:'#sRepo',branch:'#sBranch',dir:'#sDir',token:'#sToken',logo:'#sLogo'};
function fillSetup(){
  for(const k in SF)$(SF[k]).value=CFG[k]??'';
  [['#sAuto','auto'],['#sBeep','beep']].forEach(([s,k])=>
    [...$(s).children].forEach(b=>b.classList.toggle('on',String(b.dataset.v)===String(CFG[k]))));
}
pills('#sAuto',v=>{CFG.auto=Number(v);save(K_CFG,CFG)});
pills('#sBeep',v=>{CFG.beep=Number(v);save(K_CFG,CFG);beep()});
$('#btnSave').onclick=()=>{
  for(const k in SF)CFG[k]=$(SF[k]).value.trim();
  CFG.repo=CFG.repo.replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  CFG.init=parseFloat(CFG.init)||0;
  save(K_CFG,CFG);paintQuick();paintCrew();paintLogo();paint();toast('Settings saved');
};
$('#btnTest').onclick=async()=>{
  for(const k in SF)CFG[k]=$(SF[k]).value.trim();save(K_CFG,CFG);
  if(!CFG.repo||!CFG.token)return toast('Add repository and token first');
  try{const r=await fetch(`${API}/repos/${CFG.repo}`,{headers:hdr()});
    if(!r.ok)throw new Error(r.status===404?'Repository not found, or the token has no access':'Response '+r.status);
    const j=await r.json();toast('Connected to '+j.full_name);
  }catch(e){toast(String(e.message||e))}
};
$('#btnWipe').onclick=()=>{
  const un=ENT.filter(e=>!e.synced).length;
  if(!confirm('Clear all '+ENT.length+' entries on this device?'+(un?'\n'+un+' have not been sent.':'')))return;
  ENT=[];save(K_ENT,ENT);paint();toast('Cleared');
};
function paintLogo(){const i=$('#logo');if(CFG.logo){i.src=CFG.logo;i.classList.add('on')}else i.classList.remove('on')}
$('#logo').onerror=()=>$('#logo').classList.remove('on');

/* Minimised pill */
const puck=$('#puck');
let pp=load('bsk.puck',null)||{x:innerWidth-150,y:innerHeight-120};
const place=()=>{puck.style.left=Math.max(8,Math.min(innerWidth-puck.offsetWidth-8,pp.x))+'px';
                 puck.style.top=Math.max(8,Math.min(innerHeight-puck.offsetHeight-8,pp.y))+'px'};
$('#btnMin').onclick=()=>{document.body.classList.add('min');place()};
let drag=null;
puck.addEventListener('pointerdown',e=>{drag={sx:e.clientX,sy:e.clientY,ox:pp.x,oy:pp.y,m:false};puck.setPointerCapture(e.pointerId)});
puck.addEventListener('pointermove',e=>{if(!drag)return;
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>6)drag.m=true;
  pp={x:drag.ox+dx,y:drag.oy+dy};place()});
puck.addEventListener('pointerup',()=>{if(!drag)return;
  if(!drag.m)document.body.classList.remove('min');else save('bsk.puck',pp);drag=null});
addEventListener('resize',place);

/* Toast */
let tt=null;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',2000)}

/* ── Start ─────────────────────────────────────────────────────────── */
setTheme(CFG.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'),false);
fillSetup();paintQuick();paintCrew();paintLogo();setType(UI.type);setView(UI.view);
$$('#bAct button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.act));
$$('#aDir button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.adir));
$('#bQuickWrap').style.display=UI.act==='count'?'none':'';
paint();wake();
addEventListener('online',()=>Number(CFG.auto)&&sync(true));
setInterval(paintStatus,5000);
setInterval(()=>{if(Number(CFG.auto)&&ENT.some(e=>!e.synced))sync(true)},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
